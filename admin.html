<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STYLO BUYZ Admin</title><style>
body{font-family:Arial;margin:0;background:#f5f5f5;color:#111}.head{background:#090909;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}.wrap{padding:25px 5%}.grid{display:grid;grid-template-columns:1fr 2fr;gap:25px}.box{background:#fff;padding:22px;border:1px solid #eee}input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;box-sizing:border-box}button{padding:10px 14px;border:0;background:#111;color:#fff;font-weight:700;cursor:pointer}.danger{background:#b00020}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{border-bottom:1px solid #eee;padding:14px 0;display:flex;justify-content:space-between;gap:15px}.small{font-size:12px;color:#666}.tabs{display:flex;gap:8px;margin-bottom:20px}.order{border:1px solid #ddd;padding:14px;margin:10px 0;background:#fff}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="head"><b>STYLO BUYZ ADMIN</b><span>Product & Order Manager</span></div><div class="wrap"><div id="login" class="box"><h2>Admin Login</h2><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">LOGIN</button></div><div id="app" style="display:none"><div class="tabs"><button onclick="showTab('products')">PRODUCTS</button><button onclick="showTab('orders')">ORDERS</button></div><div id="productsTab"><div class="grid"><div class="box"><h2>Add Product</h2><input id="name" placeholder="Product name"><div class="row"><input id="price" type="number" placeholder="Price"><input id="stock" type="number" placeholder="Stock"></div><select id="category"><option>T-Shirts</option><option>Hoodies</option><option>Bottoms</option><option>Accessories</option></select><select id="gender"><option>Unisex</option><option>Men</option><option>Women</option></select><input id="sizes" placeholder="Sizes: S,M,L,XL"><input id="image" placeholder="Product image URL (optional)"><textarea id="desc" placeholder="Description"></textarea><button onclick="addProduct()">ADD PRODUCT</button></div><div class="box"><h2>Products</h2><div id="plist"></div></div></div></div><div id="ordersTab" style="display:none"><div class="box"><h2>Orders</h2><div id="olist"></div></div></div></div></div><script>
let pw="";function login(){pw=document.getElementById("pass").value;if(!pw)return;document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";loadProducts();loadOrders()}function api(url,opt={}){opt.headers={...(opt.headers||{}),"x-admin-password":pw,"Content-Type":"application/json"};return fetch(url,opt).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d})}
async function loadProducts(){const p=await api("/api/products");document.getElementById("plist").innerHTML=p.map(x=>`<div class="product"><div><b>${x.name}</b><div class="small">${x.category} • ${x.gender} • ₹${x.price} • Stock ${x.stock}</div></div><button class="danger" onclick="del('${x.id}')">DELETE</button></div>`).join("")}async function addProduct(){const body={name:name.value,price:Number(price.value),stock:Number(stock.value),category:category.value,gender:gender.value,sizes:sizes.value.split(",").map(x=>x.trim()).filter(Boolean),image:image.value,description:desc.value};try{await api("/api/admin/products",{method:"POST",body:JSON.stringify(body)});alert("Product added");["name","price","stock","sizes","image","desc"].forEach(id=>document.getElementById(id).value="");loadProducts()}catch(e){alert(e.message)}}async function del(id){if(!confirm("Delete product?"))return;await api("/api/admin/products/"+id,{method:"DELETE"});loadProducts()}async function loadOrders(){const o=await api("/api/admin/orders");document.getElementById("olist").innerHTML=o.length?o.reverse().map(x=>`<div class="order"><b>${x.id}</b> — ${x.status} — ₹${x.amount}<br><span class="small">${x.customer.name} • ${x.customer.phone} • ${x.customer.address}, ${x.customer.city}, ${x.customer.state} - ${x.customer.pincode}</span><br><span class="small">${x.items.map(i=>i.name+" × "+i.qty).join(", ")}</span></div>`).join(""):"No orders yet."}function showTab(t){document.getElementById("productsTab").style.display=t==="products"?"block":"none";document.getElementById("ordersTab").style.display=t==="orders"?"block":"none";if(t==="orders")loadOrders()}
</script></body></html>
